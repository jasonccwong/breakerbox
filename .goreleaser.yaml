version: 2

project_name: breakerbox

before:
  hooks:
    - pnpm install
    - pnpm --filter web build
    - sh -c "rm -rf hub/internal/webassets/dist && cp -r web/dist hub/internal/webassets/dist"

builds:
  - id: hub
    dir: hub
    binary: breakerbox-hub
    ldflags: ["-s -w -X main.version={{.Version}}"]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: agent
    dir: agent
    binary: breakerbox-agent
    ldflags: ["-s -w -X main.version={{.Version}}"]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: hub
    ids: [hub]
    name_template: "breakerbox-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: agent
    ids: [agent]
    name_template: "breakerbox-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: true
  prerelease: auto

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
